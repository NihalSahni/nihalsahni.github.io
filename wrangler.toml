name = "science-bowl-practice"
main = "party/worker.js"
compatibility_date = "2026-06-20"

[durable_objects]
bindings = [
  { name = "GAME_ROOM",   class_name = "GameRoom"    },
  { name = "LOBBY_ROOM",  class_name = "LobbyRoom"   },
  { name = "LEADERBOARD", class_name = "Leaderboard" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "LobbyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]
